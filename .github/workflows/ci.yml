# What this runs is what a developer runs by hand: `make check`, plus the lint
# pass — and, when the first game's repository is reachable, that game's
# conformance suite as the end-to-end gate.
#
# The engine job needs no game: its suite runs on the host with no network and no
# other checkout. The `first-game` job is the other half — an engine change that
# breaks a real game is caught here rather than in that game's repository.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: engine — fmt, clippy, tables, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml is the pin; `rustup show` resolves it and installs
        # what is missing.
        run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: The table source satisfies its properties, and the tables are current
        run: |
          python3 specs/verify_master_tables.py
          python3 tools/gen-tables/gen.py --check
      - name: Tests
        run: cargo test --workspace

  first-game:
    name: first game — conformance, against this engine
    # The end-to-end gate. It is inert until the first game's repository exists and
    # this workflow's token can read it: set the `KOBRA_FIRST_GAME_REPO` repository
    # variable (for example `KobraRocks/worldspiracy`) to switch it on. A private
    # game repository additionally needs a token that can read it — the default
    # token is scoped to *this* repository — which is why the game's own CI also
    # runs the engine nightly: that direction needs no extra credentials.
    if: vars.KOBRA_FIRST_GAME_REPO != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the engine into the layout the game expects
        uses: actions/checkout@v7
        with:
          # The game depends on `../kobra-games/crates/kobra-core`, so the
          # checkouts must be siblings — the same layout a developer has.
          path: kobra-games
      - name: Check out the first game beside it
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.KOBRA_FIRST_GAME_REPO }}
          path: worldspiracy
      - name: Install the pinned Rust toolchain
        run: rustup show
        working-directory: worldspiracy
      - name: Formatting
        run: cargo fmt --all -- --check
        working-directory: worldspiracy
      - name: The game's conformance suite
        run: cargo test
        working-directory: worldspiracy
